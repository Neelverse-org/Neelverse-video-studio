services:
  api:
    build:
      target: gpu
    environment:
      NEELVERSE_INFERENCE_BACKEND: krea
      NEELVERSE_HF_TOKEN: ${HF_TOKEN:-}
      NEELVERSE_KREA_MODEL_ID: ${NEELVERSE_KREA_MODEL_ID:-krea/krea-realtime-video}
      NEELVERSE_KREA_MODEL_REVISION: ${NEELVERSE_KREA_MODEL_REVISION:-}
      NEELVERSE_KREA_ENABLE_FP8: ${NEELVERSE_KREA_ENABLE_FP8:-true}
      NEELVERSE_KREA_ENABLE_COMPILE: ${NEELVERSE_KREA_ENABLE_COMPILE:-true}
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
      TORCHINDUCTOR_CACHE_DIR: /models/torchinductor
      CUDA_VISIBLE_DEVICES: "0"
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
