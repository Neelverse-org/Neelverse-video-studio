name: neelverse-video-studios

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: mock
    restart: unless-stopped
    environment:
      NEELVERSE_ENVIRONMENT: ${NEELVERSE_ENVIRONMENT:-production}
      NEELVERSE_SECRET_KEY: ${NEELVERSE_SECRET_KEY:?Set NEELVERSE_SECRET_KEY in .env}
      NEELVERSE_ADMIN_USERNAME: ${NEELVERSE_ADMIN_USERNAME:-admin}
      NEELVERSE_ADMIN_PASSWORD: ${NEELVERSE_ADMIN_PASSWORD:?Set NEELVERSE_ADMIN_PASSWORD in .env}
      NEELVERSE_ALLOWED_ORIGIN: ${NEELVERSE_PUBLIC_ORIGIN:-http://localhost:8080}
      NEELVERSE_COOKIE_SECURE: ${NEELVERSE_COOKIE_SECURE:-false}
      NEELVERSE_INFERENCE_BACKEND: mock
      NEELVERSE_DATA_DIR: /data
      NEELVERSE_MODELS_DIR: /models
      NEELVERSE_NATIVE_FPS: ${NEELVERSE_NATIVE_FPS:-8}
      NEELVERSE_DISPLAY_FPS: ${NEELVERSE_DISPLAY_FPS:-24}
    volumes:
      - ./data:/data
      - ./models:/models
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ICE_SERVERS_JSON: ${VITE_ICE_SERVERS_JSON:-[]}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NEELVERSE_WEB_PORT:-8080}:80"

  turn:
    image: coturn/coturn:4.7.0-alpine
    profiles: ["turn"]
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-neelverse.local}
      - --user=${TURN_USERNAME:-neelverse}:${TURN_PASSWORD:-change-me}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
