[project]
name = "neelverse-api"
version = "0.1.0"
description = "Authentication, queueing, WebRTC and inference orchestration for Neelverse Video Studios"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiortc>=1.14.0,<1.15",
  "av>=14,<17",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.3,<1",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = ["mypy>=1.17,<2", "ruff>=0.12,<1"]
gpu = [
  "accelerate>=1.9,<2",
  "diffusers>=0.35,<1",
  "python-socketio[asyncio_client]>=5.13,<6",
  "safetensors>=0.5,<1",
  "torch>=2.8,<3",
  "torchao>=0.12,<1",
  "transformers>=4.54,<5"
]

[tool.hatch.build.targets.wheel]
packages = ["neelverse"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109", "ASYNC240", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
